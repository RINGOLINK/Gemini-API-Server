<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini-API-Server</title>
<style>
:root{--bg:#0e0f12;--surface:#16181d;--border:rgba(255,255,255,.06);--brand:#8b5cf6;--text:#e0e1e6;--muted:#71717a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
main{text-align:center}
.logo{width:48px;height:48px;background:linear-gradient(135deg,var(--brand),#a78bfa);border-radius:14px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:22px;}
h1{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
p.sub{font-size:1.05rem;color:#a1a1aa;margin-bottom:32px}
a.card{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 24px;color:var(--text);text-decoration:none;font-size:.9rem;font-weight:500;transition:all .15s ease}
a.card:hover{border-color:var(--brand);transform:translateY(-1px)}
a.card .icon{font-size:1.1rem}
</style>
</head>
<body>
<main>
  <span style="font-size:2.8rem;line-height:1;margin-bottom:20px">🎬</span>
  <h1>Gemini-API-Server</h1>
  <p class="sub">自媒体矩阵 AI 自动运营系统</p>
  <a href="/browser" class="card"><span class="icon">🖥</span> 指纹浏览器管理</a>
</main>
</body>
</html>
